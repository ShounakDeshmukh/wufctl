[package]
name = "vcl_lib"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = [] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "1"
log = "0.4"
roxmltree = "0.21.1"


[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
